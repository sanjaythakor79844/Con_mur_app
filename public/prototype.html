<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Liv App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one phone-sized app, centred on desktop beside a small prototype rail; full-bleed on a phone.
   Monochrome system: emphasis is carried by inversion (white card on black), never by hue. */
:root{
  box-sizing:border-box;
  --page:#EDEDE8; --page-text:#0B0B0C; --page-muted:#62625E; --page-line:#D4D4CE; --page-card:#FFFFFF; --frame:#0B0B0C;
  --serif:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#050505;--page-text:#F4F4F0;--page-muted:#9A9A95;--page-line:#262628;--page-card:#121213;--frame:#2A2A2D;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#050505;--page-text:#F4F4F0;--page-muted:#9A9A95;--page-line:#262628;--page-card:#121213;--frame:#2A2A2D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* ---------- prototype chrome (not part of the app) ---------- */
.shell{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr)}
.rail{padding:32px 20px 24px 28px;border-right:1px solid var(--page-line);display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.rail h1{margin:0;font:500 30px/1.05 var(--serif);text-wrap:balance}
.rail p{margin:0;font-size:13px;line-height:1.5;color:var(--page-muted)}
.rail-k{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--page-muted)}
.jump{display:flex;flex-direction:column;gap:6px}
.jump button{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--page-line);background:var(--page-card);text-align:left;font-size:14px;font-weight:500;color:var(--page-text)}
.jump button:hover{border-color:var(--page-text)}
.stagewrap{display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;min-height:0}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .stagewrap{padding:0;align-items:stretch}
  .phone{width:100% !important;height:100% !important;border:none !important;border-radius:0 !important}
}

/* ---------- app tokens ---------- */
.phone{
  --bg:#0A0A0B; --surf:#141415; --surf2:#1D1D1F; --line:#29292C; --line2:#3D3D41;
  --text:#F5F5F1; --muted:#9B9B96; --faint:#6A6A66; --inv:#F5F5F1; --inv-fg:#0A0A0B; --inv-muted:#55554F; --inv-line:#D9D9D3;
  width:390px;height:min(844px,100%);border-radius:44px;border:8px solid var(--frame);overflow:hidden;position:relative;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px;line-height:1.45;
}
.phone[data-app="light"]{
  --bg:#FAFAF7; --surf:#FFFFFF; --surf2:#F0F0EB; --line:#E3E3DD; --line2:#C9C9C2;
  --text:#0A0A0B; --muted:#62625E; --faint:#93938D; --inv:#0A0A0B; --inv-fg:#F5F5F1; --inv-muted:#A9A9A3; --inv-line:#333336;
}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.enter .scroll>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
.enter .scroll>*:nth-child(2){animation-delay:.05s}.enter .scroll>*:nth-child(3){animation-delay:.1s}
.enter .scroll>*:nth-child(4){animation-delay:.15s}.enter .scroll>*:nth-child(5){animation-delay:.2s}
.enter .scroll>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- type ---------- */
.k{font:500 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{margin:0;font:500 32px/1.05 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.h2{margin:0;font:500 24px/1.1 var(--serif);text-wrap:balance}
.h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.sub{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.num{font-family:var(--serif);font-weight:500;font-variant-numeric:lining-nums tabular-nums;line-height:.9}
.unit{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.02em}

/* ---------- controls ---------- */
.btn{width:100%;min-height:54px;border-radius:27px;border:1px solid var(--inv);background:var(--inv);color:var(--inv-fg);font-size:15.5px;font-weight:600;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s ease;flex-shrink:0}
.btn:active{transform:scale(.975)}
.btn.ghost{background:none;color:var(--text);border-color:var(--line2)}
.btn.sm{width:auto;min-height:40px;padding:0 16px;font-size:13.5px;border-radius:20px}
.btn[disabled]{opacity:.35;cursor:default}
.link{background:none;border:none;padding:10px 4px;font-size:14px;color:var(--muted);text-align:center}
.link b{color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.icb{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;padding:0;flex-shrink:0;transition:transform .12s ease}
.icb:active{transform:scale(.92)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surf);padding:0 16px;font-size:16px;width:100%;min-width:0;outline:none;transition:border-color .18s ease,background .18s ease}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--text);background:var(--surf2)}
.inp.bad{border-color:var(--text);border-style:dashed}
.pre{display:flex;align-items:center;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surf);transition:border-color .18s ease}
.pre:focus-within{border-color:var(--text)}
.pre span{padding:0 4px 0 16px;font:400 15px var(--mono);color:var(--muted)}
.pre .inp{border:none;background:none;padding-left:8px}
.err{font-size:12.5px;line-height:1.3;color:var(--text);display:flex;gap:6px;align-items:center;animation:fade .2s ease}
.err::before{content:"!";width:15px;height:15px;border-radius:8px;background:var(--inv);color:var(--inv-fg);font:700 10px/15px var(--mono);text-align:center;flex-shrink:0}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:48px;padding:4px;border-radius:24px;background:var(--surf);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;border:none;background:none;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);transition:color .25s ease;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px}
.seg button[aria-pressed="true"]{color:var(--inv-fg)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:20px;background:var(--inv);transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:none;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s ease}
.chip.on{background:var(--inv);border-color:var(--inv);color:var(--inv-fg)}

/* ---------- surfaces ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.inv{background:var(--inv);border-color:var(--inv);color:var(--inv-fg)}
.card.inv .k,.card.inv .sub,.card.inv .unit{color:var(--inv-muted)}
.card.inv .btn{background:var(--inv-fg);border-color:var(--inv-fg);color:var(--inv)}
button.card{text-align:left;width:100%;transition:transform .14s ease}
button.card:active{transform:scale(.985)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd>div{min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.sec button{background:none;border:none;padding:6px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* status: emphasis rises with attention needed */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.pill.p{background:var(--text);color:var(--bg)}
.pill.b{border:1px solid var(--line2);color:var(--text)}
.pill.o{color:var(--muted);padding:0}
.card.inv .pill.p{background:var(--inv-fg);color:var(--inv)}

/* range bar: solid = optimal, hatched = borderline, dim = priority */
.rb{position:relative;height:6px;border-radius:3px;display:flex;gap:2px;margin:8px 0 2px}
.rb i{display:block;height:100%;border-radius:3px}
.rb .zo{background:var(--text)}
.rb .zb{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}
.rb .zp{background:var(--line2)}
.rb b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:8px;background:var(--bg);border:2px solid var(--text);box-shadow:0 0 0 3px var(--bg);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.rb b::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--text)}
.rbl{display:flex;justify-content:space-between;gap:8px;font:400 10.5px/1.3 var(--mono);color:var(--muted)}

/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.tab{border:none;background:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative;transition:color .2s ease}
.tab.on{color:var(--text)}
.tab::before{content:"";position:absolute;top:-7px;left:50%;width:18px;height:2px;margin-left:-9px;background:var(--text);border-radius:1px;transform:scaleX(0);transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.tab.on::before{transform:scaleX(1)}
.tab:active svg{transform:scale(.86)}
.tab svg{transition:transform .14s ease}
.fab{position:absolute;right:16px;bottom:84px;height:48px;padding:0 18px 0 14px;border-radius:24px;border:1px solid var(--inv);background:var(--inv);color:var(--inv-fg);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:4;transition:transform .14s ease}
.fab:active{transform:scale(.94)}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:10;animation:fade .2s ease;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;background:var(--bg);border-top:1px solid var(--line2);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .36s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0;flex-shrink:0}
.sheet .scroll{padding-top:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:20;background:var(--inv);color:var(--inv-fg);border-radius:16px;padding:13px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:rise .3s ease both;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}
</style>
<style>
/* ---------- splash ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .5s ease}
.splash.out{opacity:0}
.mark{display:block}
.mark .dots{transform-origin:50% 50%;animation:spin 40s linear infinite}
.mark .arc{stroke-dasharray:302;stroke-dashoffset:302;animation:draw 1.6s cubic-bezier(.4,0,.2,1) .2s forwards}
.mark .core{transform-origin:50% 50%;animation:breathe 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:76}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1);opacity:1}}
.wm{font:500 13px/1 var(--sans);letter-spacing:.5em;text-transform:uppercase;padding-left:.5em;opacity:0;animation:wm 1.4s cubic-bezier(.2,.7,.2,1) .7s forwards}
@keyframes wm{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.42em}}
.tag{font:italic 400 17px/1 var(--serif);color:var(--muted);opacity:0;animation:fade 1s ease 1.5s forwards}

/* ---------- stories (video holder) ---------- */
.story{position:relative;height:236px;border-radius:24px;background:var(--surf);border:1px solid var(--line);overflow:hidden;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sbars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.sbars i{flex:1;height:2.5px;border-radius:2px;background:var(--line2);overflow:hidden}
.sbars i::after{content:"";display:block;height:100%;width:0;background:var(--text)}
.sbars i.done::after{width:100%}
.sbars i.on::after{animation:fill 5.2s linear forwards}
.story.paused .sbars i.on::after,.story.paused .sv *{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.stop{position:absolute;top:22px;left:14px;right:10px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.stop .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.stop .who span{font:400 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.stop button{width:36px;height:36px;border:none;background:none;display:grid;place-items:center;padding:0;color:var(--text)}
.sbody{position:absolute;inset:0;padding:66px 18px 30px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;animation:sin .5s ease both}
@keyframes sin{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.sbody h2{margin:0;font:500 25px/1.05 var(--serif);text-wrap:balance;max-width:9.4em}
.sbody p{margin:0;font-size:12.5px;line-height:1.4;color:var(--muted);max-width:25em}
.sv{position:absolute;right:16px;top:56px;width:76px;height:76px;opacity:.95}
.sv .pulse{transform-origin:50% 50%;animation:pulse 2.6s ease-out infinite}
.sv .pulse.d2{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.sv .slide{animation:slide 3.2s cubic-bezier(.5,0,.2,1) .4s both}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.sv .ringdraw{stroke-dasharray:226;stroke-dashoffset:226;animation:rd 2.4s cubic-bezier(.3,.7,.2,1) .3s forwards}
@keyframes rd{to{stroke-dashoffset:70}}
.sv .hop{animation:hop 3.6s ease-in-out infinite}
@keyframes hop{0%,20%{transform:translate(0,0)}33%,53%{transform:translate(33px,-22px)}66%,86%{transform:translate(66px,0)}100%{transform:translate(0,0)}}
.snav{position:absolute;top:60px;bottom:0;width:38%;z-index:2;background:none;border:none;padding:0}
.snav.l{left:0}.snav.r{right:0;width:62%}
.shint{position:absolute;right:14px;bottom:12px;z-index:3;font:400 10px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase;pointer-events:none}

/* ---------- auth ---------- */
.two{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--muted);background:none;border:none;text-align:left;padding:4px 0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0;transition:all .18s ease;color:transparent}
.box.on{background:var(--inv);border-color:var(--inv);color:var(--inv-fg)}
.box.on svg{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.illo{align-self:center;margin:18px 0 4px}
.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.otp input{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surf);text-align:center;font:500 30px var(--serif);font-variant-numeric:lining-nums;outline:none;width:100%;min-width:0;transition:border-color .18s ease,transform .18s ease}
.otp input:focus{border-color:var(--text);transform:translateY(-2px)}
.otp.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.gmark{width:22px;height:22px;border-radius:11px;background:var(--inv-fg);color:var(--inv);font:700 13px/22px var(--sans);text-align:center}

/* ---------- home ---------- */
.ring{position:relative;display:grid;place-items:center;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .tr{stroke:var(--inv-line)}
.ring .ar{stroke:var(--inv-fg);transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.ring.on-bg .tr{stroke:var(--line)}.ring.on-bg .ar{stroke:var(--text)}
.ring .mid{position:absolute;text-align:center}
.noanim .ar,.noanim .rb b{transition:none}
.score{flex-direction:row;align-items:center;gap:18px;padding:20px}
.score .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;gap:8px}
.stat .num{font-size:38px}
.habit{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:11px 0;text-align:left;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:none}
.habit .box{width:26px;height:26px;border-radius:13px}
.habit .t{flex:1;min-width:0;font-size:14.5px;font-weight:500;transition:color .2s ease}
.habit .t small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.habit.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.habit.done .t small{text-decoration:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px;flex-shrink:0}
.hs::-webkit-scrollbar{display:none}
.hs .card{width:200px;flex-shrink:0;scroll-snap-align:center;padding:16px;gap:6px}
.hs .num{font-size:40px}
.appt{flex-direction:row;align-items:center;gap:14px}
.date{width:54px;height:60px;border-radius:14px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0}
.date b{font:500 24px/1 var(--serif);font-variant-numeric:lining-nums}
.date span{font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card.inv .date{border-color:var(--inv-line)}.card.inv .date span{color:var(--inv-muted)}
.empty{align-items:center;text-align:center;padding:28px 20px;gap:14px;border-style:dashed}
.steps{display:flex;flex-direction:column;gap:14px;width:100%}
.step{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--faint);transition:color .3s ease}
.step.on,.step.done{color:var(--text)}
.step .box{border-radius:11px}
.step.on .box{border-color:var(--text);border-right-color:transparent;animation:spin .8s linear infinite}

/* ---------- markers ---------- */
.mrow{display:block;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:14px 0 12px;text-align:left}
.mrow:first-of-type{border-top:none}
.mrow .top{display:flex;align-items:baseline;gap:10px}
.mrow .n{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.mrow .v{font:500 22px/1 var(--serif);font-variant-numeric:lining-nums}
.grp{padding:6px 18px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:13px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--text);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bar i.neg{background:none;border:1px solid var(--line2)}
.bar span:last-child{font:400 11.5px var(--mono);text-align:right;color:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:none}
.act p{flex:1;min-width:0;margin:0;font-size:14px;line-height:1.4}
.add{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:none;font-size:12.5px;font-weight:600;flex-shrink:0;transition:all .2s ease}
.add.on{background:var(--inv);border-color:var(--inv);color:var(--inv-fg)}

/* ---------- plan + care ---------- */
.prog{height:6px;border-radius:3px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--text);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.phases{display:grid;grid-template-columns:2fr 6fr 4fr;gap:4px;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.phases .on{color:var(--text)}
.pri{gap:0;padding:0;overflow:hidden}
.pri>button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:16px 18px;text-align:left}
.pri .no{font:500 28px/1 var(--serif);width:22px;color:var(--muted);font-variant-numeric:lining-nums}
.pri .chev{transition:transform .3s ease;color:var(--muted)}
.pri.open .chev{transform:rotate(90deg)}
.pri .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.pri.open .more{grid-template-rows:1fr}
.pri .more>div{overflow:hidden;min-height:0}
.pri .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.dots{display:flex;gap:8px}
.dots button{width:34px;height:34px;border-radius:17px;border:1.5px solid var(--line2);background:none;padding:0;transition:all .2s cubic-bezier(.3,1.6,.5,1)}
.dots button.on{background:var(--inv);border-color:var(--inv);transform:scale(1.06)}
.trk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.trk:first-of-type{border-top:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week div{border-radius:12px;padding:10px 0;text-align:center;font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid transparent}
.week div.on{background:var(--inv);color:var(--inv-fg)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surf);text-align:left;transition:all .18s ease}
.opt.on{border-color:var(--text);background:var(--surf2)}
.opt div{flex:1;min-width:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip{padding:0;height:44px}
.done-mark{width:84px;height:84px;border-radius:42px;background:var(--inv);color:var(--inv-fg);display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}

/* ---------- Liv ---------- */
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.45;animation:rise .3s ease both}
.bub.liv{background:var(--surf);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--inv);color:var(--inv-fg);align-self:flex-end;border-bottom-right-radius:6px}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:3px;background:var(--muted);animation:blink 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sugs .chip{height:auto;min-height:36px;padding:8px 14px;white-space:normal;text-align:left;color:var(--text)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important}
  .sbars i.on::after{animation-duration:5.2s !important}
}

.ms{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.ms .nd{width:26px;height:26px;border-radius:13px;border:1.5px solid var(--line2);background:var(--surf);display:grid;place-items:center;color:transparent}
.ms.done .nd{background:var(--inv);border-color:var(--inv);color:var(--inv-fg)}
.ms.now .nd{border-color:var(--text);box-shadow:0 0 0 4px var(--surf2)}
.ms span{font:400 9.5px/1.2 var(--mono);color:var(--muted);letter-spacing:.02em}
.ms.done span,.ms.now span{color:var(--text)}
.card.inv .path::before{background:var(--inv-line)}
.card.inv .ms .nd{background:var(--inv);border-color:var(--inv-line)}
.card.inv .ms.done .nd{background:var(--inv-fg);border-color:var(--inv-fg);color:var(--inv)}
.card.inv .ms.now .nd{border-color:var(--inv-fg);box-shadow:0 0 0 4px var(--inv-line)}
.card.inv .ms span{color:var(--inv-muted)}
.card.inv .ms.done span,.card.inv .ms.now span{color:var(--inv-fg)}
.badges{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.badges::-webkit-scrollbar{display:none}
.bd{flex-shrink:0;width:112px;padding:12px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bd .ico{width:34px;height:34px;border-radius:17px;background:var(--inv);color:var(--inv-fg);display:grid;place-items:center}
.bd.lock{border-style:dashed;color:var(--muted)}
.bd.lock .ico{background:none;border:1.5px dashed var(--line2);color:var(--muted)}
.bd b{font-size:12.5px;line-height:1.2}
.bd small{font-size:11px;color:var(--muted);line-height:1.25}
.pts{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow .n{font-size:14px}
.prow .n small{display:block;font:400 10.5px var(--mono);color:var(--muted);margin-top:2px}
.prow .rb{grid-column:1/-1;margin:0}
.prow .v{font:500 19px/1 var(--serif);font-variant-numeric:lining-nums;white-space:nowrap}
.prow .v small{font:400 10px var(--mono);color:var(--muted)}

<script>

  var ms=M.filter(function(m){return m.g===c[0];}),pr=ms.filter(function(m){return m.s==='p';}).length,bd=ms.filter(function(m){return m.s==='b';}).length;

   +'<div><span class="k">Account created</span><h1 class="h1" style="margin-top:10px">You\'re in, '+esc(first())+'.</h1><p class="sub" style="margin-top:10px;font:italic 400 17px/1.4 var(--serif)">Your longevity story starts with one visit. Everything after that lives here.</p></div>'
   +'<div class="aiws">'+ring(44,4,.69,'<span class="unit" style="font-size:9.5px">AIWS</span>','on-bg')+'<div><span class="k">Active Integrated Wellness Score</span><p>One number out of 100 for your whole body. Your well-being benchmark, and the first thing you will see once your report arrives.</p></div></div>'
   +'<div class="next"><div><b>1</b><span>Sign in with your number<small>A 4-digit code by SMS, or Google.</small></span></div><div><b>2</b><span>We find your kiosk screening<small>Your longevity report arrives in the app by itself.</small></span></div><div><b>3</b><span>Your AIWS score, and your plan<small>Three priorities, daily steps, your care team.</small></span></div></div>'
   +'<button class="btn" data-a="to:signin">Continue to sign in</button></div>';
}
</script>
<script>
/* ---------- actions: every tap in the app lands here ---------- */
var LASTY=0;
var HIST=[];
function push(route,extra){var sc=$('#app .scroll');HIST.push({route:S.route,marker:S.marker,track:S.track,y:sc?sc.scrollTop:0});go(route,extra);}
function pop(){var h=HIST.pop()||{route:'main',y:0};go(h.route,{marker:h.marker||S.marker,track:h.track||S.track});var sc=$('#app .scroll');if(sc)sc.scrollTop=h.y;}
function openBook(type){if(type&&type.indexOf('svc:')===0){S.book={type:'svc',svc:type.slice(4),pack:1,day:null,slot:null};}else S.book={type:type||null,day:null,slot:null};push('book');}
function act(a,el){
  var p=a.split(':'),k=p[0],v=p[1];
  switch(k){
    case 'skipsplash':go('signup');break;
    case 'spause':sPause();break;
    case 'sprev':sShow(SI-1);break;
    case 'snext':sShow(SI+1);break;
    case 'consent':S.ok=!S.ok;el.setAttribute('aria-checked',S.ok);$('#okbox').classList.toggle('on',S.ok);var e=el.nextElementSibling;if(S.ok&&e&&e.classList.contains('err'))e.remove();break;
    case 'to':S.err={};go(v,{sent:false});break;
    case 'seg':
      S[v]=p[2];var bs=el.parentNode.querySelectorAll('button'),idx=0;
      for(var i=0;i<bs.length;i++){var on=bs[i]===el;bs[i].setAttribute('aria-pressed',on);if(on)idx=i;}
      $('.thumb',el.parentNode).style.transform='translateX('+(idx*100)+'%)';
      if(v==='mode'){S.err={};S.sent=false;clearInterval(T.rs);$('#authpanel').innerHTML=authPanel();}
      if(v==='theme')$('#phone').setAttribute('data-app',S.theme);
      if(v==='plen')EXTRA.plen(p[2]);
      break;
    case 'send':sendCode();break;
    case 'change':S.sent=false;clearInterval(T.rs);$('#authpanel').innerHTML=authPanel();$('#f-phone').focus();break;
    case 'verify':verify();break;
    case 'google':el.disabled=true;el.innerHTML='<span class="spin"></span>Connecting to Google';T.g=setTimeout(function(){go('main',{tab:'home'});},1000);break;
    case 'tab':
      if(S.route==='main'&&S.tab===v&&!S.sheet){var sc=$('#app .scroll');if(sc)sc.scrollTo({top:0,behavior:'smooth'});break;}
      if(v==='markers'&&S.tab!=='markers')S.filter='all';
      HIST=[];go('main',{tab:v});break;
    case 'filter':if(S.tab==='markers'&&S.route==='main'){S.filter=v;render(false);}else go('main',{tab:'markers',filter:v});break;
    case 'sheet':S.sheet=p.slice(1).join(':');sheet();break;
    case 'close':S.sheet=null;sheet();break;
    case 'habit':
      var d=S.habits[v]=!S.habits[v];el.classList.toggle('done',d);el.setAttribute('aria-checked',d);$('.box',el).classList.toggle('on',d);if(d&&typeof award==='function')award(10,null,el);
      var rows=document.querySelectorAll('#today .habit'),list=[],dn=0;for(var ri=0;ri<rows.length;ri++){list.push(1);if(rows[ri].classList.contains('done'))dn++;}$('#tcount').textContent=dn+' of '+list.length+' done';$('#today .prog i').style.width=(dn/list.length*100)+'%';
      if(dn===list.length&&!S.dayDone){S.dayDone=true;S.streak++;if(typeof award==='function')award(25);toast('Day complete. '+S.streak+'-day streak. +35 pts');unlock('day');}
      else if(dn<list.length&&S.dayDone){S.dayDone=false;S.streak--;}
      var st=$('#streak');if(st)st.textContent=S.streak;break;
    case 'marker':push('marker',{marker:v});break;
    case 'back':pop();break;
    case 'track':if(S.route==='booked'||S.route==='track'){if(S.route==='booked')HIST=[];go('track',{track:v});}else push('track',{track:v});break;
    case 'step':var sk=v+':'+p[2];S.steps[sk]=true;award(20,null,el);unlock('step');render(false);var pg=trProg(trk(v));toast('Step done. '+pg[0]+' of '+pg[1]+' in this journey.',function(){delete S.steps[sk];render(false);});break;
    case 'stepbook':var stp=trk(v).steps[+p[2]];if(stp.cta[1].indexOf('svc:')===0){S.book={type:'svc',svc:stp.cta[1].slice(4),pack:1,step:v+':'+p[2]};S.sheet='svc:'+stp.cta[1].slice(4);sheet();}else{openBook(stp.cta[1]);S.book.step=v+':'+p[2];}break;
    case 'pkgreq':S.pkg[v]=true;sheet();render(false);toast('Request sent. The centre will call you within a day.');break;
    case 'add':
      var key=v+':'+p[2],on2=S.added[key]=!S.added[key];el.classList.toggle('on',on2);el.setAttribute('aria-pressed',on2);el.textContent=on2?'Added':'Add to plan';
      if(S.dayDone&&on2){S.dayDone=false;S.streak--;}
      if(on2)toast('Added to today\'s plan',function(){EXTRA.seetoday();},'See today');else toast('Removed from your plan');break;
    case 'newbook':openBook(v);break;
    case 'bookback':pop();break;
    case 'btype':S.book.type=v;render(false);break;
    case 'bday':S.book.day=+v;render(false);break;
    case 'bslot':S.book.slot=p.slice(1).join(':');render(false);var cb=$('#app .btn');if(cb)cb.scrollIntoView({block:'end',behavior:'smooth'});break;
    case 'confirm':
      if(S.book.type==='svc'){confirmSvc();break;}
      var b=S.book,t=BT[b.type];if(b.replace)S.appts=S.appts.filter(function(x){return x.id!==b.replace;});
      S.appts.push({id:Date.now(),t:t[0],w:t[1].split(' · ')[0],d:bookDays()[b.day],h:b.slot});if(b.step){S.steps[b.step]={b:fmt(bookDays()[b.day])+', '+b.slot};S.lastTrack=b.step.split(':')[0];}else S.lastTrack=null;HIST=[];go('booked');break;
    case 'resched':var ap=S.appts.filter(function(x){return x.id==v;})[0];openBook(ap&&ap.fixed?'pod':ap&&/Coach/.test(ap.t)?'coach':null);S.book.replace=ap?ap.id:null;break;
    case 'cancel':
      var gone=S.appts.filter(function(x){return x.id==v;})[0];S.appts=S.appts.filter(function(x){return x.id!=v;});S.sheet=null;sheet();render(false);
      toast('Visit cancelled',function(){S.appts.push(gone);render(false);});break;
    case 'undo':if(toast.undo){toast.undo();toast.undo=null;$('#toast').innerHTML='';}break;
    case 'pri':S.open=S.open===+v?-1:+v;var cards=document.querySelectorAll('#app .pri');for(var c=0;c<cards.length;c++){cards[c].classList.toggle('open',c===S.open);$('button',cards[c]).setAttribute('aria-expanded',c===S.open);}break;
    case 'dot':
      var n=+p[2];S[v]=S[v]===n?n-1:n;var ds=el.parentNode.querySelectorAll('button');for(var j=0;j<ds.length;j++){ds[j].classList.toggle('on',j<S[v]);ds[j].setAttribute('aria-pressed',j<S[v]);}
      if(S[v]===3)toast(v==='meals'?'Three protein meals logged':'Three walks logged. Nice work.');break;
    case 'pick':$('#filein').click();break;
    case 'sample':S.file='';S.src='upload';go('analyzing');break;
    case 'fetch':S.src='kiosk';go('analyzing');break;
    case 'resync':el.disabled=true;el.innerHTML='<span class="spin"></span>Checking the kiosk';T.rsn=setTimeout(function(){S.sheet=null;sheet();toast('You have the latest report. Next one after '+fmt(RETEST)+'.');},1300);break;
    case 'q':ask(LQ[+v][0],LQ[+v][1]);break;
    case 'sendliv':
      var inp=$('#livin'),q=inp.value.trim();if(!q)break;inp.value='';
      var hit=LQ.filter(function(x){return x[0].toLowerCase()===q.toLowerCase();})[0];
      ask(q,hit?hit[1]:'This demo answers the suggested questions. In the full app I answer from your own report, in English, Hindi or Marathi.');break;
    case 'askliv':var m=byId(v);S.sheet='liv';sheet();ask('Tell me about my '+m.n,m.m+(m.a.length?' First step: '+m.a[0].charAt(0).toLowerCase()+m.a[0].slice(1)+'.':''));break;
    case 'say':toast(p.slice(1).join(':'));break;
    case 'restart':var th=S.theme;S=seedExtra(fresh());S.theme=th;go('splash');break;
    case 'signout':go('signin',{sent:false,mode:'otp'});toast('Signed out');break;
    default:if(EXTRA[k])EXTRA[k](v,p,el);
  }
}

/* ---------- events ---------- */
var phone=$('#phone');
phone.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.classList.contains('scrim')&&e.target!==el)return;   // taps inside a sheet do not close it
  act(el.getAttribute('data-a'),el);
});
phone.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='signup'&&!S.busy)submitSignup();});
phone.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute('data-f');
  if(f){
    if(f==='phone'||f==='age'){var dg=t.value.replace(/\D/g,'').slice(0,f==='age'?3:10);t.value=f==='phone'&&dg.length>5?dg.slice(0,5)+' '+dg.slice(5):dg;}
    S[f]=t.value;
    if(S.err[f]){delete S.err[f];t.classList.remove('bad');var er=t.closest('.field').querySelector('.err');if(er)er.remove();}
    return;
  }
  if(t.parentNode&&t.parentNode.id==='otp'){
    t.value=t.value.replace(/\D/g,'').slice(-1);var i=+t.id.slice(3);
    if(t.value&&i<3)$('#otp'+(i+1)).focus();
    if(t.value&&i===3){var full=true;for(var j=0;j<4;j++)if(!$('#otp'+j).value)full=false;if(full){t.blur();verify();}}
  }
});
phone.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Backspace'&&t.parentNode&&t.parentNode.id==='otp'&&!t.value){var i=+t.id.slice(3);if(i>0){var pv=$('#otp'+(i-1));pv.value='';pv.focus();}}
  if(e.key==='Enter'&&t.id==='livin'){e.preventDefault();act('sendliv');}
  if(e.key==='Enter'&&t.id==='f-phone'&&S.route==='signin'){e.preventDefault();sendCode();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;sheet();}});
phone.addEventListener('paste',function(e){
  var t=e.target;if(!(t.parentNode&&t.parentNode.id==='otp'))return;
  var d=((e.clipboardData||{getData:function(){return '';}}).getData('text')||'').replace(/\D/g,'').slice(0,4);if(d.length<4)return;
  e.preventDefault();for(var i=0;i<4;i++)$('#otp'+i).value=d.charAt(i);verify();
});
phone.addEventListener('focusin',function(e){if(S.route==='signup'&&e.target.classList.contains('inp'))sPause(true);});
document.addEventListener('change',function(e){if(e.target.id==='filein'&&e.target.files&&e.target.files[0]){S.file=e.target.files[0].name;S.src='upload';e.target.value='';go('analyzing');}});
var jb=document.querySelectorAll('[data-j]');
for(var ji=0;ji<jb.length;ji++)jb[ji].addEventListener('click',function(){
  var j=this.getAttribute('data-j'),th=S.theme;
  if(j==='splash'){S=seedExtra(fresh());S.theme=th;go('splash');}
  else if(j==='signup'||j==='signin'||j==='welcome')go(j,{sent:false,err:{}});
  else go('main',{tab:'home',has:j==='full',found:j==='full'?S.found:false,src:j==='full'?(S.src||'kiosk'):S.src});
});

/* ---------- start ---------- */
$('#over').innerHTML='<div id="sheet"></div><div id="toast"></div><input type="file" id="filein" accept="application/pdf,image/*" hidden>';
render(true);
</script>

</body>
</html>
